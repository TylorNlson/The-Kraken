<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MystQ</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game">
        <div id="introScreen">
            <button onclick="startGame()" class="start-button">Start Game</button>
        </div>
        <div id="gameScreen" style="display:none;">
            <p id="phraseToGuess"></p>
            <p id="lettersRemaining"></p>
            <p id="hitpoints"></p>
            <input type="text" id="letterInput" maxlength="1" autocapitalize="none">
            <button onclick="guessLetter()">Guess</button>
        </div>
        <div id="resultScreen" style="display:none;">
            <p id="resultMessage"></p>
            <button onclick="restartGame()">Restart Game</button>
        </div>
    </div>

    <!-- Audio element for background music -->
    <audio id="backgroundMusic" src="Music.mp3" loop></audio>

    <!-- Music control UI -->
    <div id="musicControl" style="position: fixed; bottom: 10px; right: 10px; background: transparent; border-radius: 5px; padding: 1px; display: flex; align-items: center; z-index: 1000;">
        <button id="muteButton" aria-label="Mute/Unmute music" style="background: none; border: none; cursor: grab; font-size: 10px; line-height: 1; user-select: none; touch-action: none;">🔊</button>
    </div>

    <script>
        let phrases = [];
        let secretPhrase, guessPhrase, badGuesses, lettersRemaining;

        const backgroundMusic = document.getElementById('backgroundMusic');
        const muteButton = document.getElementById('muteButton');

        // Initialize mute state
        let isMuted = false;

        muteButton.addEventListener('click', () => {
            isMuted = !isMuted;
            backgroundMusic.muted = isMuted;
            muteButton.textContent = isMuted ? '🔇' : '🔊';
        });

        // Drag and drop functionality for muteButton
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        muteButton.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragOffsetX = e.clientX - muteButton.getBoundingClientRect().left;
            dragOffsetY = e.clientY - muteButton.getBoundingClientRect().top;
            muteButton.style.cursor = 'grabbing';
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                let newLeft = e.clientX - dragOffsetX;
                let newTop = e.clientY - dragOffsetY;
                // Keep within viewport bounds
                newLeft = Math.min(window.innerWidth - muteButton.offsetWidth, Math.max(0, newLeft));
                newTop = Math.min(window.innerHeight - muteButton.offsetHeight, Math.max(0, newTop));
                muteButton.style.position = 'fixed';
                muteButton.style.left = newLeft + 'px';
                muteButton.style.top = newTop + 'px';
                muteButton.style.right = 'auto';
                muteButton.style.bottom = 'auto';
            }
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                muteButton.style.cursor = 'grab';
            }
        });

        async function fetchPhrases() {
            try {
                const response = await fetch('https://api.datamuse.com/words?ml=phrase&max=10');
                const data = await response.json();
                phrases = data.map(item => item.word);
            } catch (error) {
                console.error("Error fetching phrases:", error);
                phrases = ["to thyself be true", "fit as a fiddle", "good guys always win", "just drink more coffee", "cat in a hat"];
            }
        }

        async function initializeGame() {
            if (phrases.length === 0) {
                await fetchPhrases();
            }
            secretPhrase = phrases[Math.floor(Math.random() * phrases.length)];
            guessPhrase = secretPhrase.replace(/[^ ]/g, '.');
            badGuesses = 0;
            lettersRemaining = "abcdefghijklmnopqrstuvwxyz";
            updateGameScreen();
        }

        async function startGame() {
            document.getElementById('introScreen').style.display = 'none';
            document.body.style.backgroundColor = '#f4f4f4';
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('phraseToGuess').innerText = "Loading phrase...";
            await initializeGame();
            backgroundMusic.play().catch(e => {
                console.warn("Music play was prevented:", e);
            });
        }

        function updateGameScreen() {
            document.getElementById('phraseToGuess').innerText = `Phrase to guess: ${guessPhrase}`;
            document.getElementById('lettersRemaining').innerText = `Letters Remaining: ${lettersRemaining}`;
            document.getElementById('hitpoints').innerText = `Hitpoints: ${60 - badGuesses * 10}/60`;
        }

        function guessLetter() {
            let letter = document.getElementById('letterInput').value.toLowerCase();
            document.getElementById('letterInput').value = '';
            if (lettersRemaining.includes(letter)) {
                lettersRemaining = lettersRemaining.replace(letter, ' ');
                if (secretPhrase.includes(letter)) {
                    let regex = new RegExp(letter, 'g');
                    guessPhrase = guessPhrase.split('').map((char, index) => secretPhrase[index] === letter ? letter : char).join('');
                } else {
                    badGuesses++;
                }
                updateGameScreen();
                checkGameOver();
            }
        }

        function checkGameOver() {
            if (guessPhrase === secretPhrase || badGuesses === 6) {
                document.getElementById('gameScreen').style.display = 'none';
                document.getElementById('resultScreen').style.display = 'block';
                document.getElementById('resultMessage').innerText = guessPhrase === secretPhrase ? "Congratulations... You saved the world." : "We're doomed. You were Humanity's last hope...";
                backgroundMusic.pause();
                backgroundMusic.currentTime = 0;
            }
        }

        function restartGame() {
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('introScreen').style.display = 'block';
            document.getElementById('phraseToGuess').innerText = '';
            document.getElementById('lettersRemaining').innerText = '';
            document.getElementById('hitpoints').innerText = '';
            document.getElementById('letterInput').value = '';
            startGame();
        }
    </script>
</body>
</html>
